apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-reduce
  namespace: de-hw5
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: pairs
          image: de-hw5-pairs:1
          imagePullPolicy: Never
          args: ["reduce", "--parts", "8", "--prefix", "RUN_PREFIX"]
          envFrom: [{secretRef: {name: rustfs-auth}}]
          env: [{name: S3_ENDPOINT, value: "http://rustfs:9000"}]
          resources:
            requests: {cpu: 250m, memory: 96Mi}
            limits: {cpu: "1", memory: 192Mi}

apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-JOB_STAGE
  namespace: de-hw5
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: pairs
          image: de-hw5-pairs:1
          imagePullPolicy: Never
          args: ["single"]
          resources:
            requests: {cpu: 250m, memory: JOB_REQUEST}
            limits: {cpu: "1", memory: JOB_LIMIT}
          volumeMounts:
            - {name: input, mountPath: /input, readOnly: true}
      volumes:
        - name: input
          persistentVolumeClaim: {claimName: input}

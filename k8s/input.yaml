apiVersion: v1
kind: Namespace
metadata:
  name: de-hw5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: input
  namespace: de-hw5
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: input-loader
  namespace: de-hw5
spec:
  automountServiceAccountToken: false
  containers:
    - name: loader
      image: de-hw5-pairs:1
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      envFrom:
        - secretRef:
            name: rustfs-auth
            optional: true
      env:
        - name: S3_ENDPOINT
          value: http://rustfs:9000
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
      volumeMounts:
        - {name: input, mountPath: /input}
  volumes:
    - name: input
      persistentVolumeClaim: {claimName: input}

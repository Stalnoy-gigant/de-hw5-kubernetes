apiVersion: v1
kind: Pod
metadata:
  name: quota-DEMO_ID
  namespace: de-hw5-quota
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: hold
      image: de-hw5-pairs:1
      imagePullPolicy: Never
      command: ["sleep", "300"]
      resources:
        requests: {cpu: 300m, memory: 16Mi}
        limits: {cpu: 300m, memory: 32Mi}
